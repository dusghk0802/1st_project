<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>커뮤니티 | CINEHUB</title>

  <!-- 공통 CSS -->
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <!-- =========================
       상단
  ========================== -->
  <header>

    <!-- 로그인 상태 메뉴 -->
    <div class="user-menu">

      <button
        type="button"
        class="logout-button"
        onclick="
          if (confirm('로그아웃하시겠습니까?')) {
            location.href='../index.html';
          }
        "
      >
        로그아웃
      </button>

    </div>


    <!-- 홈 이동 -->
    <h1>
      <a href="../index.html">
        CINEHUB
      </a>
    </h1>

  </header>


  <main>

    <!-- =========================
         커뮤니티 전체 영역
    ========================== -->
    <section class="community-container">


      <!-- =========================
           커뮤니티 상단
      ========================== -->
      <div class="community-header">

        <h2>
          커뮤니티
        </h2>

      </div>


      <!-- =========================
           커뮤니티 카테고리

           현재는 화면 확인용으로
           전체 메뉴에 active 적용

           추후 Java 백엔드에서
           현재 category / sort 값을 확인해서
           해당 메뉴에 active 클래스를 적용
      ========================== -->
      <nav class="community-category">

        <!-- 전체 -->
        <a
          href="list.html"
          class="active"
        >
          전체
        </a>


        <!-- 공지사항 -->
        <a href="list.html?category=notice">
          공지사항
        </a>


        <!-- 영화리뷰 -->
        <a href="list.html?category=review">
          영화리뷰
        </a>


        <!-- 영화추천 -->
        <a href="list.html?category=recommend">
          영화추천
        </a>


        <!-- 자유토론 -->
        <a href="list.html?category=free">
          자유토론
        </a>


        <!-- 인기글 -->
        <a href="list.html?sort=popular">
          인기글
        </a>

      </nav>


      <!-- =========================
           검색 / 글쓰기
      ========================== -->
      <div class="search-area">

        <input
          type="text"
          id="post-search"
          name="keyword"
          placeholder="게시글을 검색하세요"
        >


        <!-- 검색 -->
        <button type="button">
          검색
        </button>


        <!-- 글쓰기 -->
        <button
          type="button"
          onclick="location.href='form.html'"
        >
          글쓰기
        </button>

      </div>


      <!-- =========================
           공지사항
      ========================== -->
      <section class="community-notice">

        <div class="community-section-title">

          <h3>
            공지사항
          </h3>

        </div>


        <!--
          화면 확인용 임시 데이터

          추후 Java 백엔드 + DB 연동 시
          등록된 공지사항 데이터를 조회하여 표시
        -->
        <div class="notice-post">

          <div class="post-list-main">

            <a href="detail.html">
              [공지] CINEHUB 이용 안내
            </a>

          </div>


          <div class="post-list-info">

            <span>
              관리자
            </span>

            <span>
              2026.08.25
            </span>

          </div>

        </div>

      </section>


      <!-- =========================
           게시글 목록
      ========================== -->
      <section class="post-list">

        <div class="community-section-title">

          <h3>
            게시글 목록
          </h3>

        </div>


        <!--
          화면 확인용 임시 데이터

          추후 Java 백엔드 + DB 연동 시
          조회된 게시글 데이터를
          .post-list-item 구조로 반복 출력

          전체
          → 전체 게시글 조회

          category=review
          → 영화리뷰만 조회

          category=recommend
          → 영화추천만 조회

          category=free
          → 자유토론만 조회

          sort=popular
          → 인기글 조회
        -->


        <!-- 게시글 1 -->
        <div class="post-list-item">

          <div class="post-list-main">

            <a href="detail.html">
              [영화리뷰] 엔딩 팽이 씬에 대한 3가지 해석
            </a>

          </div>


          <div class="post-list-info">

            <span>
              유저A
            </span>

            <span>
              조회 1420
            </span>

            <span>
              추천 45
            </span>

            <span>
              댓글 12
            </span>

          </div>

        </div>


        <!-- 게시글 2 -->
        <div class="post-list-item">

          <div class="post-list-main">

            <a href="detail.html">
              [영화추천] 주말에 볼 SF 영화 추천해주세요
            </a>

          </div>


          <div class="post-list-info">

            <span>
              유저B
            </span>

            <span>
              조회 520
            </span>

            <span>
              추천 21
            </span>

            <span>
              댓글 8
            </span>

          </div>

        </div>

      </section>


      <!-- =========================
           게시글이 없을 경우
      ========================== -->

      <!--
      <div class="empty-message">
        등록된 게시글이 없습니다.
      </div>
      -->


      <!-- =========================
           페이징

           현재는 화면 확인용으로
           1페이지에 active 적용

           추후 Java 백엔드에서
           현재 page 값을 확인해서
           해당 페이지 번호에 active 적용
      ========================== -->
      <div class="pagination">

        <!-- 이전 -->
        <a
          href="list.html?page=1"
          class="page-button"
        >
          이전
        </a>


        <!-- 1페이지 -->
        <a
          href="list.html?page=1"
          class="page-number active"
        >
          1
        </a>


        <!-- 2페이지 -->
        <a
          href="list.html?page=2"
          class="page-number"
        >
          2
        </a>


        <!-- 3페이지 -->
        <a
          href="list.html?page=3"
          class="page-number"
        >
          3
        </a>


        <!-- 다음 -->
        <a
          href="list.html?page=2"
          class="page-button"
        >
          다음
        </a>

      </div>

    </section>

  </main>

</body>
</html>
