<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>게시판 수정 | CINEHUB ADMIN</title>

  <!-- 공통 CSS -->
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <!-- =========================
       상단
  ========================== -->
  <header>
    <h1>
      <a href="../index.html">CINEHUB ADMIN</a>
    </h1>
  </header>


  <main>

    <div class="admin-container">

      <!-- =========================
           관리자 메뉴
      ========================== -->
      <nav class="admin-menu">

        <a href="dashboard.html">
          대시보드
        </a>

        <a href="users.html">
          회원 관리
        </a>

        <a href="reports.html">
          신고 관리
        </a>

        <a href="boards.html">
          게시판 관리
        </a>

        <a href="notices.html">
          공지사항 관리
        </a>
        
        <div class="admin-logout">
          <button
            type="button"
            onclick="if (confirm('로그아웃하시겠습니까?')) {
                location.href='../index.html';}">
            로그아웃
      </nav>


      <!-- =========================
           게시판 수정 영역
      ========================== -->
      <section class="admin-content">

        <h2>게시판 수정</h2>


        <form class="board-edit-form">

          <!-- 게시판명 -->
          <div class="admin-form-group">

            <label for="board-name">
              게시판명
            </label>

            <input
              type="text"
              id="board-name"
              name="boardName"
              value="커뮤니티"
            >

          </div>


          <!-- 게시판 설명 -->
          <div class="admin-form-group">

            <label for="board-description">
              설명
            </label>

            <textarea
              id="board-description"
              name="boardDescription"
              rows="5"
            >영화 관련 이야기를 나누는 게시판</textarea>

          </div>


          <!-- 정렬 순서 -->
          <div class="admin-form-group">

            <label for="sort-order">
              정렬 순서
            </label>

            <input
              type="number"
              id="sort-order"
              name="sortOrder"
              value="1"
              min="1"
            >

          </div>


          <!-- 하단 버튼 -->
          <div class="admin-form-actions">

            <!-- 취소 -->
            <button
              type="button"
              onclick="location.href='boards.html'"
            >
              취소
            </button>


            <!-- 수정 완료 -->
            <button
              type="button"
              onclick="
                if (confirm('게시판을 수정하시겠습니까?')) {
                  location.href='boards.html';
                }
              "
            >
              수정 완료
            </button>

          </div>

        </form>

      </section>

    </div>

  </main>

</body>
</html>
