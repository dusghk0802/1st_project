<!doctype html><html lang='ko'><head><meta charset='utf-8'><script>window.__CINEHUB_BASE='/1st_project/';window.__CINEHUB_DEMO=true;(function(){var B=window.__CINEHUB_BASE,of=window.fetch.bind(window),EX='우주|사랑|좀비|마블|비 오는 날'.split('|');function json(o,s){return Promise.resolve(new Response(JSON.stringify(o),{status:s,headers:{'Content-Type':'application/json'}}));}function toast(t){var d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:9999;background:rgba(23,24,27,.92);color:#fff;padding:12px 18px;border-radius:8px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)';document.body.appendChild(d);setTimeout(function(){d.remove();},2600);}function file(u){var a=new URL(u,location.href);if(a.origin!==location.origin)return null;var p=a.pathname;if(p.indexOf(B)===0)p='/'+p.slice(B.length);if(p.indexOf('/api/')!==0)return null;var k=p.slice(5).replace(/\/+$/,'');if(a.search.length>1)k+='__'+a.search.slice(1).replace(/%/g,'_').replace(/&/g,'-').replace(/=/g,'.');return {path:p,url:B+'api/'+k+'.json'};}window.fetch=function(u,o){var f=file(typeof u==='string'?u:u.url);if(!f)return of(u,o);var m=((o&&o.method)||'GET').toUpperCase();if(f.path==='/api/me')return json({error:'login required'},401);if(m!=='GET'){if(f.path==='/api/taste-quiz/recommend')return of(f.url);toast('시연용 페이지라 로그인·글쓰기 같은 기능은 사용할 수 없어요.');return json({error:'시연용 페이지에서는 사용할 수 없는 기능이에요.'},403);}return of(f.url).then(function(r){if(r.ok)return r;if(f.path==='/api/movies/search')return json({results:[],message:'시연용 페이지에서는 예시 검색어만 검색할 수 있어요: '+EX.join(', ')},200);return json({error:'시연용 데이터가 없어요.'},404);});};document.addEventListener('DOMContentLoaded',function(){var main=document.querySelector('main');if(main){var n=document.createElement('div');n.style.cssText='width:min(1100px,calc(100% - 22px));margin:-12px auto 22px;padding:10px 16px;border-radius:8px;background:#fff5f6;border:1px solid #f3c7cc;color:#7a1f28;font-size:1 ;d.textContent=v||'';return d.innerHTML;}var allPosts=[],page=1;function filtered(){var q=document.getElementById('postSearch').value.trim().toLowerCase();return q?allPosts.filter(function(p){return (p.title+' '+p.content+' '+p.author).toLowerCase().indexOf(q)>=0;}):allPosts;}function draw(){var a=filtered(),pages=Math.max(1,Math.ceil(a.length/10));if(page>pages)page=1;document.getElementById('posts').innerHTML=a.slice((page-1)*10,page*10).map(function(p){return '<a class="post-card" href="/1st_project/post/'+p.id+'"><h3>'+safe(p.title)+'</h3><p>'+safe(p.content).slice(0,100)+'</p><small>'+safe(p.author)+' · '+safe(p.createdAt)+'</small></a>';}).join('')||'<p class="muted">검색 결과가 없습니다.</p>';['postPaginationTop','postPagination'].forEach(function(navId){renderPagination(document.getElementById(navId),page,pages,function(n){page=n;draw();window.scrollTo({top:0,behavior:'smooth'});});});}function doSearch(){page=1;draw();}document.getElementById('postSearchButton').onclick=doSearch;document.getElementById('postSearch').onkeydown=function(e){if(e.key==='Enter')doSearch();};fetch('/1st_project/api/boards').then(function(r){return r.json();}).then(function(d){document.getElementById('boardLinks').innerHTML='<a class="active" href="/1st_project/posts">전체</a>'+(d.boards||[]).map(function(b){return '<a href="/1st_project/category/'+b.id+'">'+safe(b.name)+'</a>';}).join('');});fetch('/1st_project/api/posts').then(function(r){return r.json();}).then(function(d){allPosts=d.posts||[];draw();});fetch('/1st_project/api/me').then(function(r){return r.ok?r.json():null;}).then(function(u){if(!u)return;document.getElementById('navLogin').style.display='none';document.getElementById('navRegister').style.display='none';document.getElementById('navUser').style.display='inline-block';document.getElementById('navLogout').style.display='inline-block';document.getElementById('navMyPage').textContent=u.nickname+'님';document.getElementById('navNotifications').style.display='list-item';if(u.role==='ADMIN')document.getElementById('navAdmin').style.display='list-item';});document.getElementById('navLogout').onclick=function(e){e.preventDefault();fetch('/1st_project/api/auth/logout',{method:'POST'}).then(function(){location.href='/1st_project/';});};</script><script>(function(){var timer;function fill(){fetch('/1st_project/api/posts').then(function(r){return r.json();}).then(function(d){var by={};(d.posts||[]).forEach(function(p){by[p.id]=p;});document.querySelectorAll('a.post-card:not([data-list-stats])').forEach(function(card){var m=(card.getAttribute('href')||'').match(/\/post\/(\d+)/);var p=m&&by[m[1]];if(!p)return;var s=document.createElement('small');s.className='muted post-list-stats';s.textContent='조회 '+p.views+' · 좋아요 '+p.likes;card.appendChild(s);card.setAttribute('data-list-stats','1');});});}function schedule(){clearTimeout(timer);timer=setTimeout(fill,40);}new MutationObserver(schedule).observe(document.documentElement,{childList:true,subtree:true});schedule();})();</script></body></html>
