<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 | CINEHUB</title>

  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <!-- 홈 이동 -->
  <header>
    <h1>
      <a href="../index.html">CINEHUB</a>
    </h1>
  </header>

  <main>

    <!-- 회원가입 영역 -->
    <section class="register-container">

      <h2>회원가입</h2>

      <form>

        <!-- 아이디 -->
        <div class="input-group">
          <label for="login-id">아이디</label>

          <div class="input-row">
            <input
              type="text"
              id="login-id"
              name="loginId"
              placeholder="아이디를 입력하세요"
              required
            >

            <button type="button">
              중복확인
            </button>
          </div>

          <p class="help-text">
            영문+숫자 4~12자
          </p>
        </div>

        <!-- 닉네임 -->
        <div class="input-group">
          <label for="nickname">닉네임</label>

          <div class="input-row">
            <input
              type="text"
              id="nickname"
              name="nickname"
              placeholder="닉네임을 입력하세요"
              required
            >

            <button type="button">
              중복확인
            </button>
          </div>

          <p class="help-text">
            한글/영문/숫자 2~10자
          </p>
        </div>

        <!-- 비밀번호 -->
        <div class="input-group">
          <label for="password">비밀번호</label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="비밀번호를 입력하세요"
            required
          >

          <p class="help-text">
            영문, 숫자, 특수문자 조합 8~20자
          </p>
        </div>

        <!-- 비밀번호 확인 -->
        <div class="input-group">
          <label for="password-confirm">비밀번호 확인</label>

          <input
            type="password"
            id="password-confirm"
            name="passwordConfirm"
            placeholder="비밀번호를 다시 입력하세요"
            required
          >
        </div>

        <!-- 이메일 -->
        <div class="input-group">
          <label for="email">이메일</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="이메일을 입력하세요"
            required
          >
        </div>

        <!-- 회원가입 -->
        <button
          type="submit"
          class="register-button"
        >
          회원가입 완료
        </button>

      </form>

    </section>

  </main>

</body>
</html>
